<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050b14">
  <meta name="description" content="KINGTHERIOUS — Live Trading Statistics & Performance Transparency.">
  <title>Statistik Live & Performa EA | KINGTHERIOUS</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050a12;
      --panel: rgba(4, 17, 30, .88);
      --line: rgba(0, 190, 226, .38);
      --cyan: #08d8ed;
      --teal: #00e0b2;
      --text: #f3f7ff;
      --muted: #a9bdd7;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background:
        radial-gradient(ellipse at 75% 35%, rgba(0, 96, 135, .14), transparent 38%),
        radial-gradient(ellipse at 10% 60%, rgba(0, 204, 170, .07), transparent 32%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    a { color: inherit; text-decoration: none; }
    .topbar {
      min-height: 88px;
      padding: 14px clamp(18px, 3vw, 46px);
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(0, 194, 232, .35);
      background: rgba(4, 11, 21, .94);
    }
    .brand { display: flex; align-items: center; gap: 15px; }
    .brand-mark { width: 49px; height: 49px; display: grid; place-items: center; color: var(--cyan); }
    .brand-mark svg { width: 100%; height: 100%; }
    .brand-name { font-size: 22px; line-height: 1.05; letter-spacing: .055em; font-weight: 850; }
    .brand-tag { color: var(--teal); font-size: 10px; font-weight: 750; letter-spacing: .22em; margin-top: 7px; }
    
    main { padding: 40px clamp(18px, 3vw, 46px); max-width: 1200px; margin: 0 auto; }
    .page-header { margin-bottom: 35px; }
    .page-header h1 { font-size: clamp(28px, 3vw, 42px); margin: 0 0 10px; font-weight: 850; }
    .page-header p { color: var(--muted); font-size: 16px; margin: 0; }

    .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .metric {
      padding: 24px; border: 1px solid rgba(0, 152, 208, .52);
      border-radius: 18px; background: rgba(2, 15, 28, .8);
    }
    .metric-label { color: #c4d5ee; font-size: 14px; margin-bottom: 8px; }
    .metric-value { font-size: 36px; font-weight: 850; color: var(--teal); }
    .metric:nth-child(2) .metric-value { color: var(--cyan); }

    .back-btn {
      display: inline-flex; align-items: center; gap: 8px; color: var(--cyan);
      font-weight: 600; margin-bottom: 20px; font-size: 14px;
    }
    .back-btn:hover { text-decoration: underline; }
    
    footer { border-top: 1px solid rgba(0, 174, 226, .18); padding: 22px clamp(18px, 3vw, 46px); color: #7e92ac; text-align: center; font-size: 12px; }
  </style>
</head>
<body>

  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none">
          <path d="M8 18 23 27 31 7 40 27 56 17 51 48 33 59 14 48 8 18Z" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
          <path d="M23 27 25 46 33 52 40 27M14 31 25 39M50 30 40 39M31 7 33 25" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
        </svg>
      </span>
      <span>
        <div class="brand-name">KINGTHERIOUS</div>
        <div class="brand-tag">LIVE STATISTICS</div>
      </span>
    </a>
    <a href="index.html" class="back-btn" style="margin:0;">← Kembali ke Beranda</a>
  </header>

  <main>
    <div class="page-header">
      <h1>Transparansi Performa Live Trading</h1>
      <p>Data performa real-time yang disinkronkan langsung dari akun MT5 klien ke database aman.</p>
    </div>

    <!-- Kotak Metrik Data Live -->
    <div class="metrics">
      <article class="metric">
        <div class="metric-label">Avg. Monthly Profit</div>
        <div class="metric-value" id="valMonthly">-</div>
      </article>
      <article class="metric">
        <div class="metric-label">Win Rate</div>
        <div class="metric-value" id="valWinRate">-</div>
      </article>
      <article class="metric">
        <div class="metric-label">Profit Percentage</div>
        <div class="metric-value" id="valTotalProfit">-</div>
      </article>
      <article class="metric">
        <div class="metric-label">Total Active Accounts</div>
        <div class="metric-value" id="valAccounts">-</div>
      </article>
    </div>
  </main>

  <footer>
    <span>© <span id="year"></span> KINGTHERIOUS. All rights reserved.</span>
  </footer>

  <!-- Integrasi Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // Konfigurasi Supabase Anda (Ganti dengan URL & Anon Key project Anda)
    const SUPABASE_URL = 'https://YOUR_PROJECT_ID.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function fetchTradingStats() {
      try {
        // Mengambil data dari tabel trading_stats (bisa di-sum atau diambil rata-ratanya)
        const { data, error } = await supabaseClient
          .from('trading_stats')
          .select('*');

        if (error) throw error;

        if (data && data.length > 0) {
          // Contoh kalkulasi sederhana atau mengambil data terbaru
          let totalMonthly = 0;
          let totalWinRate = 0;
          let totalProfitPct = 0;
          
          data.forEach(row => {
            totalMonthly += Number(row.monthly_profit || 0);
            totalWinRate += Number(row.win_rate || 0);
            totalProfitPct += Number(row.total_profit_pct || 0);
          });

          const count = data.length;
          
          // Tampilkan ke elemen HTML
          document.getElementById('valMonthly').textContent = `+${(totalMonthly / count).toFixed(1)}%`;
          document.getElementById('valWinRate').textContent = `${(totalWinRate / count).toFixed(1)}%`;
          document.getElementById('valTotalProfit').textContent = `+${(totalProfitPct / count).toFixed(1)}%`;
          document.getElementById('valAccounts').textContent = count;
        }
      } catch (err) {
        console.error('Gagal mengambil data statistik:', err.message);
      }
    }

    // Jalankan saat halaman dimuat
    fetchTradingStats();
  </script>
</body>
</html>
