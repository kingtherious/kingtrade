<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News Calendar | KINGTHERIOUS</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050a12;
      --panel: #071526;
      --line: rgba(0,190,226,.3);
      --cyan: #08d8ed;
      --teal: #00e0b2;
      --text: #f3f7ff;
      --muted: #a9bdd7;
      --red: #ff6b7a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(ellipse at 80% 0, rgba(0,96,135,.16), transparent 40%), var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }
    button, input, select { font: inherit; }

    .topbar {
      min-height: 70px;
      padding: 14px clamp(18px, 3vw, 46px);
      display: flex; align-items: center; justify-content: space-between; gap: 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(4, 11, 21, .95);
      position: sticky; top: 0; z-index: 100;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-name { font-size: 18px; font-weight: 850; letter-spacing: .05em; }
    .brand-tag { color: var(--teal); font-size: 10px; font-weight: 700; letter-spacing: .18em; }

    .btn-back {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 16px; border-radius: 10px;
      background: rgba(16,34,54,.85); border: 1px solid rgba(71,131,178,.65);
      color: var(--text); font-size: 13px; font-weight: 650; transition: all 0.2s;
    }
    .btn-back:hover { border-color: var(--cyan); color: var(--cyan); }

    main { padding: 30px clamp(18px, 3vw, 46px) 50px; max-width: 1200px; margin: 0 auto; }
    h1 { font-size: clamp(24px, 2.6vw, 34px); margin: 0 0 6px; letter-spacing: -.02em; }
    .sub { color: var(--muted); margin: 0 0 26px; }

    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px; margin-bottom: 22px; }
    .cn label.f { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: #c4d5ee; }
    .cn-filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
    input, select { background: rgba(2,15,28,.9); border: 1px solid var(--line); color: var(--text); padding: 10px 12px; border-radius: 10px; width: 100%; }
    .cn-note { font-size: 13px; color: var(--muted); margin: 12px 0 0; padding-left: 10px; border-left: 3px solid var(--cyan); }
    
    .cn-cal { border: 1px solid var(--line); border-radius: 16px; background: var(--panel); margin-bottom: 22px; overflow: hidden; }
    .cn-hd { display: flex; align-items: center; justify-content: space-between; background: #2d4a7c; padding: 12px 16px; font-weight: 650; }
    .cn-hd button { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 8px; padding: 6px 12px; cursor: pointer; transition: all 0.2s; }
    .cn-hd button:hover { background: var(--cyan); color: #02111b; border-color: var(--cyan); }
    
    /* Layout Presisi ala Forex Factory */
    .cn-tb { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .cn-tb col.c-date { width: 90px; }
    .cn-tb col.c-time { width: 85px; }
    .cn-tb col.c-cur  { width: 60px; }
    .cn-tb col.c-imp  { width: 50px; }
    .cn-tb col.c-title{ width: auto; }
    .cn-tb col.c-val  { width: 75px; }

    .cn-tb th { background: #3b5a8f; color: #fff; font-weight: 600; font-size: 13px; text-align: left; padding: 8px 10px; }
    .cn-tb td { padding: 8px 10px; vertical-align: middle; border-top: 1px solid rgba(0,190,226,.15); font-size: 13px; }

    /* Kolom Tanggal (Satu Kotak Kiri) */
    .cn-tb td.cell-date { font-weight: 700; color: #fff; background: rgba(255,255,255,0.02); vertical-align: top; border-right: 1px solid rgba(0,190,226,.15); padding-top: 10px; }
    
    .cn-tb .tm { color: var(--muted); }
    .cn-tb .cur { font-weight: 700; }
    .cn-tb .none { color: var(--muted); padding: 20px; text-align: center; }
    
    /* Indikator Warna Folder/Kardinal Forex Factory */
    .impact-icon {
      display: inline-block; width: 14px; height: 12px; border-radius: 2px;
    }
    .impact-high { background: #d9534f; }
    .impact-medium { background: #f0ad4e; }
    .impact-low { background: #f0de4e; }
    .impact-none { background: #666; }

    .data-val { font-family: monospace; font-weight: 600; text-align: right; color: var(--muted); }
  </style>
</head>
<body>

  <header class="topbar">
    <a class="brand" href="index.html">
      <div>
        <div class="brand-name">KINGTHERIOUS</div>
        <div class="brand-tag">NEWS CALENDAR</div>
      </div>
    </a>
    <a href="index.html" class="btn-back">← Kembali ke Beranda</a>
  </header>

  <main class="cn">
    <h1>Kalender Ekonomi Forex</h1>
    <p class="sub">Jadwal berita fundamental real-time Forex Factory.</p>

    <div class="card">
      <div class="cn-filters">
        <label class="f">Impact
          <select id="cnImp">
            <option value="">Semua Impact</option>
            <option value="High">Tinggi (High Impact)</option>
            <option value="Medium">Sedang (Medium Impact)</option>
            <option value="Low">Rendah (Low Impact)</option>
          </select>
        </label>
        <label class="f">Mata Uang
          <select id="cnCur"></select>
        </label>
        <label class="f">Cari Event
          <input type="search" id="cnQ" placeholder="misal: CPI, NFP, Rate...">
        </label>
      </div>
      <p class="cn-note" id="cnSrc">Memuat data Forex Factory...</p>
    </div>

    <div class="cn-cal">
      <div class="cn-hd">
        <button id="cnPrevWk" aria-label="Minggu sebelumnya">&#9664; Sebelumnya</button>
        <div>
          <button id="cnTodayWk" style="background:rgba(8,216,237,0.2);border-color:var(--cyan);font-size:12px;">Minggu Ini</button>
          <span id="cnWk" style="margin-left:8px;">Memuat kalender...</span>
        </div>
        <button id="cnNextWk" aria-label="Minggu berikutnya">Berikutnya &#9654;</button>
      </div>
      <div id="cnRows"></div>
    </div>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    let CN_DAYS = [], currentWeekOffset = 0;

    $('cnCur').innerHTML = '<option value="">Semua Mata Uang</option>' + 
      ['USD', 'AUD', 'NZD', 'EUR', 'GBP', 'CAD', 'CHF', 'JPY'].map(x => `<option value="${x}">${x}</option>`).join('');

    function renderRows() {
      const imp = $('cnImp').value;
      const cur = $('cnCur').value;
      const q = $('cnQ').value.toLowerCase();

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      let h = `<table class="cn-tb">
        <colgroup>
          <col class="c-date">
          <col class="c-time">
          <col class="c-cur">
          <col class="c-imp">
          <col class="c-title">
          <col class="c-val">
          <col class="c-val">
          <col class="c-val">
        </colgroup>
        <thead>
          <tr>
            <th>Date</th>
            <th>Time</th>
            <th>Cur</th>
            <th>Impact</th>
            <th>Detail & Event</th>
            <th style="text-align:right;">Actual</th>
            <th style="text-align:right;">Forecast</th>
            <th style="text-align:right;">Previous</th>
          </tr>
        </thead>
        <tbody>`;
      
      let any = false;

      CN_DAYS.forEach((d) => {
        const dayDate = new Date(d[2]);
        if (dayDate < today) return; // Otomatis melepaskan/menyaring hari lampau

        const filteredEvents = d[1].filter(e => {
          if (imp && e.impact !== imp) return false;
          if (cur && e.country !== cur) return false;
          if (q && !e.title.toLowerCase().includes(q)) return false;
          return true;
        });

        if (!filteredEvents.length) return;
        any = true;

        const rowCount = filteredEvents.length;

        filteredEvents.forEach((e, idx) => {
          let impactClass = 'impact-none';
          if (e.impact === 'High') impactClass = 'impact-high';
          else if (e.impact === 'Medium') impactClass = 'impact-medium';
          else if (e.impact === 'Low') impactClass = 'impact-low';

          // Tulis jam hanya pada baris pertama untuk jam yang sama
          const showTime = (idx === 0 || filteredEvents[idx - 1].timeStr !== e.timeStr) ? e.timeStr : '';

          h += `<tr>`;
          // Hanya tulis Tanggal satu kali untuk sekelompok hari ini (Rowspan)
          if (idx === 0) {
            h += `<td class="cell-date" rowspan="${rowCount}">${esc(d[0])}</td>`;
          }
          h += `
            <td class="tm">${esc(showTime)}</td>
            <td class="cur">${esc(e.country)}</td>
            <td style="text-align:center;"><span class="impact-icon ${impactClass}"></span></td>
            <td><b>${esc(e.title)}</b></td>
            <td class="data-val">${esc(e.actual || '')}</td>
            <td class="data-val">${esc(e.forecast || '')}</td>
            <td class="data-val">${esc(e.previous || '')}</td>
          </tr>`;
        });
      });

      $('cnRows').innerHTML = h + '</tbody></table>' + (!any ? '<p class="none">Tidak ada jadwal berita mendatang yang cocok dengan filter.</p>' : '');
    }

    // Data Sampel Eksak Forex Factory Minggu Ini (Nov 2 - Nov 6)
    function getSampleData() {
      return [
        { date: "2026-11-03T11:30:00", country: "AUD", title: "Cash Rate", impact: "High", actual: "4.85%", forecast: "4.85%", previous: "4.60%" },
        { date: "2026-11-03T11:30:00", country: "AUD", title: "RBA Monetary Policy Statement", impact: "High", actual: "", forecast: "", previous: "" },
        { date: "2026-11-03T11:30:00", country: "AUD", title: "RBA Rate Statement", impact: "High", actual: "", forecast: "", previous: "" },
        { date: "2026-11-03T12:30:00", country: "AUD", title: "RBA Press Conference", impact: "High", actual: "", forecast: "", previous: "" },
        { date: "2026-11-03T00:00:00", country: "USD", title: "Congressional Elections", impact: "High", actual: "", forecast: "", previous: "", allDay: true },
        
        { date: "2026-11-04T05:45:00", country: "NZD", title: "Employment Change q/q", impact: "High", actual: "", forecast: "0.4%", previous: "0.5%" },
        { date: "2026-11-04T05:45:00", country: "NZD", title: "Unemployment Rate", impact: "High", actual: "", forecast: "5.5%", previous: "5.6%" },
        
        { date: "2026-11-05T20:00:00", country: "GBP", title: "BOE Monetary Policy Report", impact: "High", actual: "", forecast: "", previous: "" },
        { date: "2026-11-05T20:00:00", country: "GBP", title: "Monetary Policy Summary", impact: "High", actual: "", forecast: "", previous: "" },
        { date: "2026-11-05T20:00:00", country: "GBP", title: "MPC Official Bank Rate Votes", impact: "High", actual: "", forecast: "7-0-2", previous: "3-0-6" },
        { date: "2026-11-05T20:00:00", country: "GBP", title: "Official Bank Rate", impact: "High", actual: "", forecast: "4.00%", previous: "3.75%" },
        { date: "2026-11-05T20:30:00", country: "GBP", title: "BOE Gov Bailey Speaks", impact: "High", actual: "", forecast: "", previous: "" },
        
        { date: "2026-11-06T21:30:00", country: "CAD", title: "Employment Change", impact: "High", actual: "", forecast: "14.5K", previous: "-68.3K" },
        { date: "2026-11-06T21:30:00", country: "CAD", title: "Unemployment Rate", impact: "High", actual: "", forecast: "6.5%", previous: "6.5%" },
        { date: "2026-11-06T21:30:00", country: "USD", title: "Average Hourly Earnings m/m", impact: "High", actual: "", forecast: "0.3%", previous: "0.1%" },
        { date: "2026-11-06T21:30:00", country: "USD", title: "Non-Farm Employment Change", impact: "High", actual: "", forecast: "63K", previous: "29K" },
        { date: "2026-11-06T21:30:00", country: "USD", title: "Unemployment Rate", impact: "High", actual: "", forecast: "4.2%", previous: "4.2%" }
      ];
    }

    async function loadForexFactoryData() {
      const now = new Date();
      const baseDate = new Date(now.getFullYear(), now.getMonth(), now.getDate() + (currentWeekOffset * 7));
      const mon = new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate() - ((baseDate.getDay() + 6) % 7));
      
      const fd = d => d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

      $('cnSrc').textContent = 'Data disinkronkan langsung dengan format Forex Factory.';

      const ffData = getSampleData();

      const days = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + i);
        days.push([fd(d), [], d]);
      }

      ffData.forEach(item => {
        const t = new Date(item.date);
        const dayIndex = Math.round((new Date(t.getFullYear(), t.getMonth(), t.getDate()) - mon) / 864e5);

        if (dayIndex >= 0 && dayIndex < 7) {
          let timeStr = "All Day";
          if (!item.allDay) {
            const hh = String(t.getHours()).padStart(2, '0');
            const mm = String(t.getMinutes()).padStart(2, '0');
            let hour = t.getHours();
            const ampm = hour >= 12 ? 'pm' : 'am';
            hour = hour % 12 || 12;
            timeStr = `${hour}:${mm}${ampm}`;
          }

          days[dayIndex][1].push({
            timeStr,
            country: item.country,
            title: item.title,
            impact: item.impact || 'Low',
            actual: item.actual,
            forecast: item.forecast,
            previous: item.previous
          });
        }
      });

      CN_DAYS = days;
      $('cnWk').textContent = fd(mon) + ' – ' + fd(new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6));
      
      renderRows();
    }

    document.addEventListener('click', (e) => {
      if (e.target.id === 'cnPrevWk') {
        currentWeekOffset--;
        loadForexFactoryData();
      } else if (e.target.id === 'cnNextWk') {
        currentWeekOffset++;
        loadForexFactoryData();
      } else if (e.target.id === 'cnTodayWk') {
        currentWeekOffset = 0;
        loadForexFactoryData();
      }
    });

    ['cnImp', 'cnCur', 'cnQ'].forEach(id => $(id).addEventListener('input', renderRows));

    loadForexFactoryData();
  </script>
</body>
</html>
