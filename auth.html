<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk & Daftar - KINGTHERIOUS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Header / Navbar Sederhana -->
    <header class="p-6 flex justify-between items-center max-w-7xl mx-auto w-full">
        <a href="index.html" class="flex items-center space-x-2 text-xl font-bold tracking-wider">
            <span>KINGTHERIOUS</span>
        </a>
        <a href="index.html" class="text-sm text-slate-400 hover:text-white transition">← Kembali ke Beranda</a>
    </header>

    <!-- Main Container -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
            
            <!-- Tab Switcher (Login / Register) -->
            <div class="flex bg-slate-800 p-1 rounded-xl mb-8">
                <button id="tab-login" onclick="switchTab('login')" class="flex-1 py-2.5 text-sm font-medium rounded-lg transition text-white bg-slate-700 shadow">Masuk</button>
                <button id="tab-register" onclick="switchTab('register')" class="flex-1 py-2.5 text-sm font-medium rounded-lg transition text-slate-400 hover:text-white">Daftar</button>
            </div>

            <!-- Form Login -->
            <form id="form-login" class="space-y-5" onsubmit="handleLogin(event)">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Email Trading</label>
                    <input type="email" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 transition" placeholder="nama@email.com">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Kata Sandi</label>
                    <input type="password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 transition" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-blue-600/20">Masuk ke Akun</button>
            </form>

            <!-- Form Register -->
            <form id="form-register" class="space-y-5 hidden" onsubmit="handleRegister(event)">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Nama Lengkap</label>
                    <input type="text" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 transition" placeholder="Nama Anda">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Email Trading</label>
                    <input type="email" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 transition" placeholder="nama@email.com">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Nomor Akun MT4/MT5</label>
                    <input type="text" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 transition" placeholder="Contoh: 12345678">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Kata Sandi</label>
                    <input type="password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 transition" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-blue-600/20">Daftarkan Lisensi</button>
            </form>

        </div>
    </main>

    <!-- Footer -->
    <footer class="p-6 text-center text-xs text-slate-500">
        © KINGTHERIOUS. All rights reserved.
    </footer>

    <!-- Script JavaScript untuk Tab & Simulasi Submit -->
    <script>
        function switchTab(tab) {
            const loginForm = document.getElementById('form-login');
            const registerForm = document.getElementById('form-register');
            const loginTab = document.getElementById('tab-login');
            const registerTab = document.getElementById('tab-register');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                
                loginTab.className = "flex-1 py-2.5 text-sm font-medium rounded-lg transition text-white bg-slate-700 shadow";
                registerTab.className = "flex-1 py-2.5 text-sm font-medium rounded-lg transition text-slate-400 hover:text-white";
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                
                registerTab.className = "flex-1 py-2.5 text-sm font-medium rounded-lg transition text-white bg-slate-700 shadow";
                loginTab.className = "flex-1 py-2.5 text-sm font-medium rounded-lg transition text-slate-400 hover:text-white";
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            alert('Fitur login akan segera terhubung dengan database.');
        }

        function handleRegister(e) {
            e.preventDefault();
            alert('Registrasi berhasil! Lisensi akun Anda sedang diproses.');
        }
    </script>
</body>
</html>
